<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passkey Identity Sample</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.5rem; }
  .section { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
  .section h2 { font-size: 1.1rem; margin-top: 0; }
  label { display: block; margin-bottom: 0.25rem; font-weight: 600; }
  input { width: 100%; padding: 0.5rem; margin-bottom: 0.75rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  button { padding: 0.5rem 1rem; margin-right: 0.5rem; margin-bottom: 0.5rem; border: 1px solid #888; border-radius: 4px; background: #f0f0f0; cursor: pointer; }
  button:hover { background: #e0e0e0; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { margin-top: 1rem; padding: 0.75rem; border-radius: 4px; white-space: pre-wrap; }
  .success { background: #d4edda; border: 1px solid #c3e6cb; }
  .error { background: #f8d7da; border: 1px solid #f5c6cb; }
  .info { background: #d1ecf1; border: 1px solid #bee5eb; }
  .note { font-size: 0.85rem; color: #666; margin-top: 0.5rem; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>Passkey Identity Sample</h1>
  <p class="note">Development-only bootstrap credentials: demo@example.com / DemoPass123!</p>

  <div id="unauthenticated-section" class="section">
    <h2>Sign in with password</h2>
    <label for="email">Email</label>
    <input type="text" id="email" value="demo@example.com" />
    <label for="password">Password</label>
    <input type="password" id="password" value="DemoPass123!" />
    <button id="btn-login">Sign in with password</button>
  </div>

  <div id="authenticated-section" class="section hidden">
    <h2>Authenticated actions</h2>
    <button id="btn-create-passkey">Create passkey</button>
    <button id="btn-list-passkeys">List my passkeys</button>
    <button id="btn-logout">Sign out</button>
  </div>

  <div id="passkey-signin-section" class="section">
    <h2>Sign in with passkey</h2>
    <label for="passkey-email">Email</label>
    <input type="text" id="passkey-email" value="demo@example.com" />
    <button id="btn-passkey-signin">Sign in with passkey</button>
  </div>

  <div id="status"></div>

  <script src="passkeys.js"></script>
</body>
</html>
