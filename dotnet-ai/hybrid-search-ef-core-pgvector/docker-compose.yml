services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: dotnet-guide-hybrid-search-postgres
    environment:
      POSTGRES_DB: hybridsearch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hybridsearch"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - hybridsearch-data:/var/lib/postgresql/data

volumes:
  hybridsearch-data: