          project="ef-core/multitenancy-softdelete-auditing/src/EfCoreTenantGuardrailsMinimal/EfCoreTenantGuardrailsMinimal.csproj"

          test "$(grep --count '<PackageReference' "${project}")" = "1"
          grep --fixed-strings 'Include="Microsoft.EntityFrameworkCore.Sqlite"' "${project}"
          grep --fixed-strings 'Version="10.0.11"' "${project}"

      - name: Verify named filter guardrails
        shell: bash
        run: |
          context="ef-core/multitenancy-softdelete-auditing/src/EfCoreTenantGuardrailsMinimal/Data/TenantDbContext.cs"
          queries="ef-core/multitenancy-softdelete-auditing/src/EfCoreTenantGuardrailsMinimal/Queries/TenantQueries.cs"

          grep --fixed-strings 'TenantFilterName' "${context}"
          grep --fixed-strings 'SoftDeleteFilterName' "${context}"
          grep --fixed-strings 'IgnoreQueryFilters' "${queries}"

          if grep --fixed-strings 'IgnoreQueryFilters()' "${queries}"; then
            echo "Blanket query-filter bypass found in production helper."
            exit 1
          fi

      - name: Verify exact tenant-isolation output
        shell: bash
        run: |
          output="$(
            dotnet run \
              --project ef-core/multitenancy-softdelete-auditing/src/EfCoreTenantGuardrailsMinimal/EfCoreTenantGuardrailsMinimal.csproj \
              --configuration Release \
              --no-build
          )"

          expected="$(
            printf '%s\n' \
              'EF Core Tenant Isolation Lab' \
              'Visible tasks: alpha=1, beta=1' \
              'Same local ID: alpha=Alpha plan | beta=Beta plan' \
              'Alpha including deleted: 2, foreign tenants=0' \
              'Spoofed insert stamped tenant: alpha' \
              'Soft delete: visible alpha=1, physical alpha=3, deletedBy=alpha-admin'
          )"

          printf '%s\n' "${output}"
          test "${output}" = "${expected}"

      - name: Verify no generated database artifacts
        shell: bash
        run: |
          if find \
              ef-core/multitenancy-softdelete-auditing \
              -type f \
              \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) \
              -print -quit | grep --quiet .; then
            echo "Generated SQLite database file found."
            exit 1
          fi

  test-ef-core-provider-contrast:
    name: Test EF Core provider contrast sample
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: >
          dotnet restore
          ef-core/testing-sqlite-inmemory-vs-inmemory/EfCoreProviderContrastMinimal.slnx

      - name: Build
        run: >
          dotnet build
          ef-core/testing-sqlite-inmemory-vs-inmemory/EfCoreProviderContrastMinimal.slnx
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test
          ef-core/testing-sqlite-inmemory-vs-inmemory/EfCoreProviderContrastMinimal.slnx
          --configuration Release
          --no-build

      - name: Verify EF Core provider baseline
        shell: bash
        run: |
          project="ef-core/testing-sqlite-inmemory-vs-inmemory/src/EfCoreProviderContrastMinimal/EfCoreProviderContrastMinimal.csproj"

          test "$(
            grep \
              --count \
              '<PackageReference' \
              "${project}"
          )" = "2"

          grep \
            --fixed-strings \
            'Include="Microsoft.EntityFrameworkCore.InMemory"' \
            "${project}"

          grep \
            --fixed-strings \
            'Include="Microsoft.EntityFrameworkCore.Sqlite"' \
            "${project}"

          test "$(
            grep \
              --count \
              'Version="10.0.11"' \
              "${project}"
          )" = "2"

      - name: Verify exact provider-contrast output
        shell: bash
        run: |
          output="$(
            dotnet run \
              --project ef-core/testing-sqlite-inmemory-vs-inmemory/src/EfCoreProviderContrastMinimal/EfCoreProviderContrastMinimal.csproj \
              --configuration Release \
              --no-build
          )"

          expected="$(
            printf '%s\n' \
              'EF Core Test Provider Contrast Lab' \
              'Unique index: InMemory=accepted | SQLite=rejected' \
              'Foreign key: InMemory=accepted | SQLite=rejected' \
              'Transaction: InMemory=unsupported | SQLite=rollback-ok' \
              'Database cascade: InMemory=orphan-remains | SQLite=child-removed' \
              'Guidance: relational behavior -> production provider when practical; SQLite remains a test double.'
          )"

          printf '%s\n' "${output}"

          if [[ "${output}" != "${expected}" ]]; then
            echo "Unexpected provider-contrast output."
            exit 1
          fi

      - name: Verify provider-contrast boundaries
        shell: bash
        run: |
          sample="ef-core/testing-sqlite-inmemory-vs-inmemory"

          grep -R \
            --include='*.cs' \
            --include='*.csproj' \
            --fixed-strings \
            'Foreign Keys=True' \
            "${sample}/src"

          grep -R \
            --include='*.cs' \
            --include='*.csproj' \
            --fixed-strings \
            'InMemoryDatabaseRoot' \
            "${sample}/src"

          if grep -R \
              --include='*.cs' \
              --include='*.csproj' \
              -E \
              'TransactionIgnoredWarning|BenchmarkDotNet|Stopwatch' \
              "${sample}/src"; then
            echo "Unexpected ignored-transaction or benchmark code found."
            exit 1
          fi

      - name: Verify no generated database artifacts
        shell: bash
        run: |
          if find \
              ef-core/testing-sqlite-inmemory-vs-inmemory \
              -type f \
              \( \
                -name '*.db' \
                -o -name '*.sqlite' \
                -o -name '*.sqlite3' \
              \) \
              -print \
              -quit |
              grep \
                --quiet \
                .; then
            echo "Generated SQLite database file found."
            exit 1
          fi


