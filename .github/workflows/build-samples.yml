        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore \
            dotnet-ai/provider-agnostic-chat-gateway/ChatGatewayMinimal.csproj

      - name: Build
        run: |
          dotnet build \
            dotnet-ai/provider-agnostic-chat-gateway/ChatGatewayMinimal.csproj \
            --configuration Release \
            --no-restore

