        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: >
          dotnet restore
          csharp-language/modern-patterns-result-pipeline/ResultPipelineLab.slnx

      - name: Build
        run: >
          dotnet build
          csharp-language/modern-patterns-result-pipeline/ResultPipelineLab.slnx
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test
          csharp-language/modern-patterns-result-pipeline/ResultPipelineLab.slnx
          --configuration Release
          --no-build

      - name: Verify explicit C# language version
        shell: bash
        run: |
          app_version="$(
            dotnet msbuild \
              csharp-language/modern-patterns-result-pipeline/src/ResultPipelineLab/ResultPipelineLab.csproj \
              -getProperty:LangVersion
          )"

          test_version="$(
            dotnet msbuild \
              csharp-language/modern-patterns-result-pipeline/tests/ResultPipelineLab.Tests/ResultPipelineLab.Tests.csproj \
              -getProperty:LangVersion
          )"

          echo "Application LangVersion: ${app_version}"
          echo "Test LangVersion: ${test_version}"

          test "${app_version}" = "12.0"
          test "${test_version}" = "12.0"

      - name: Run deterministic Result pipeline sample
        shell: bash
        run: |
          output="$(
            dotnet run \
              --project csharp-language/modern-patterns-result-pipeline/src/ResultPipelineLab/ResultPipelineLab.csproj \
              --configuration Release \
              --no-build
          )"

          printf '%s\n' "${output}"

          printf -v expected '%s\n' \
            'C# 12 Result Pipeline Lab' \
            'Success: imported=2, writes=1' \
            'Products: Widget Pro | Travel Mug' \
            'Failure: code=VALIDATE_BATCH_FAILED, writes=0' \
            'Public message: 1 record(s) failed validation.'

          expected="${expected%$'\n'}"

          if [[ "${output}" != "${expected}" ]]; then
            echo "Console output did not match the expected output."

            diff \
              --unified \
              <(printf '%s\n' "${expected}") \
              <(printf '%s\n' "${output}") \
              || true

            exit 1
          fi

          line_count="$(
            printf '%s\n' "${output}" |
              wc --lines |
              tr --delete ' '
          )"

          test "${line_count}" = "5"

  test-background-job-queue:
    name: Test bounded background job queue
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: >
          dotnet restore
          dotnet-8-essentials/background-jobs-hostedservice-queues/BackgroundJobQueueMinimal.slnx

      - name: Build
        run: >
          dotnet build
          dotnet-8-essentials/background-jobs-hostedservice-queues/BackgroundJobQueueMinimal.slnx
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test
          dotnet-8-essentials/background-jobs-hostedservice-queues/BackgroundJobQueueMinimal.slnx
          --configuration Release
          --no-build

      - name: Smoke-test API
        shell: bash
        run: |
          app_log="${RUNNER_TEMP}/background-job-queue.log"

          ASPNETCORE_URLS="http://127.0.0.1:5096" \
            dotnet run \
              --project dotnet-8-essentials/background-jobs-hostedservice-queues/src/BackgroundJobQueueMinimal/BackgroundJobQueueMinimal.csproj \
              --configuration Release \
              --no-build \
              >"${app_log}" 2>&1 &

          app_pid="$!"

          cleanup() {
            kill "${app_pid}" 2>/dev/null || true
            wait "${app_pid}" 2>/dev/null || true
          }

          trap cleanup EXIT

          for attempt in $(seq 1 40); do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:5096/ \
              >"${RUNNER_TEMP}/background-job-root.json"; then
              break
            fi

            if ! kill -0 "${app_pid}" 2>/dev/null; then
              cat "${app_log}"
              exit 1
            fi

            sleep 0.25
          done

          root="$(
            cat "${RUNNER_TEMP}/background-job-root.json"
          )"

          expected_root='{"sample":"bounded-background-job-queue","durability":"in-memory","capacity":4}'

          test "${root}" = "${expected_root}"

          queue="$(
            curl \
              --fail \
              --silent \
              http://127.0.0.1:5096/jobs/queue
          )"

          expected_queue='{"capacity":4,"depth":0,"accepting":true}'

          test "${queue}" = "${expected_queue}"

          status="$(
            curl \
              --silent \
              --output "${RUNNER_TEMP}/invalid-job.json" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"to":"","subject":""}' \
              http://127.0.0.1:5096/jobs/email
          )"

          test "${status}" = "400"

  test-config-precedence:
    name: Test typed configuration precedence sample
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: >
          dotnet restore
          dotnet-8-essentials/configuration-secrets-environments/ConfigPrecedenceMinimal.slnx

      - name: Build
        run: >
          dotnet build
          dotnet-8-essentials/configuration-secrets-environments/ConfigPrecedenceMinimal.slnx
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test
          dotnet-8-essentials/configuration-secrets-environments/ConfigPrecedenceMinimal.slnx
          --configuration Release
          --no-build

      - name: Verify application has no direct packages
        shell: bash
        run: |
          output="$(
            dotnet list \
              dotnet-8-essentials/configuration-secrets-environments/src/ConfigPrecedenceMinimal/ConfigPrecedenceMinimal.csproj \
              package
          )"

          printf '%s\n' "${output}"

          printf '%s\n' "${output}" |
            grep --fixed-strings \
              "No package references were found"

      - name: Verify configuration precedence and redaction
        shell: bash
        env:
          DOTNET_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5097
          CFGPLAY_App__ApiKey: ci-demo-key-1234
          CFGPLAY_App__TimeoutSeconds: "30"
        run: |
          app_log="${RUNNER_TEMP}/config-precedence.log"

          dotnet run \
            --project dotnet-8-essentials/configuration-secrets-environments/src/ConfigPrecedenceMinimal/ConfigPrecedenceMinimal.csproj \
            --configuration Release \
            --no-build \
            -- \
            --App:TimeoutSeconds=40 \
            --Features:AdvancedSearch=false \
            >"${app_log}" 2>&1 &

          app_pid="$!"

          cleanup() {
            kill "${app_pid}" 2>/dev/null || true
            wait "${app_pid}" 2>/dev/null || true
          }

          trap cleanup EXIT

          for attempt in $(seq 1 40); do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:5097/ \
              >"${RUNNER_TEMP}/config-root.json"; then
              break
            fi

            if ! kill -0 "${app_pid}" 2>/dev/null; then
              cat "${app_log}"
              exit 1
            fi

            sleep 0.25
          done

          root="$(
            cat "${RUNNER_TEMP}/config-root.json"
          )"

          expected_root='{"sample":"typed-config-precedence","environment":"Development","serviceBaseUrl":"https://api.example.test","timeoutSeconds":40,"advancedSearch":false,"apiKeyConfigured":true}'

          if [[ "${root}" != "${expected_root}" ]]; then
            printf 'Unexpected root response:\n%s\n' "${root}"
            exit 1
          fi

          diagnostics="$(
            curl \
              --fail \
              --silent \
              http://127.0.0.1:5097/dev/config
          )"

          expected_diagnostics='{"environment":"Development","serviceBaseUrl":"https://api.example.test","timeoutSeconds":40,"advancedSearch":false,"apiKey":"[REDACTED]","apiKeyConfigured":true}'

          if [[ "${diagnostics}" != "${expected_diagnostics}" ]]; then
            printf 'Unexpected diagnostics response:\n%s\n' "${diagnostics}"
            exit 1
          fi

          if printf '%s\n%s\n' \
              "${root}" \
              "${diagnostics}" |
              grep --quiet \
                --fixed-strings \
                "ci-demo-key-1234"; then
            echo "Secret-like CI value leaked into an HTTP response."
            exit 1
          fi
